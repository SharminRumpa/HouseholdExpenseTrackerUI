<div class="auth-screen">
  <form class="panel auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand-mark">৳</div>
    <h1>Create account</h1>
    <p>Household Expense Tracker</p>

    <label for="name">Full name</label>
    <input id="name" type="text" formControlName="name" />

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />

    <label for="mobileNumber">Mobile number (optional)</label>
    <input id="mobileNumber" type="tel" formControlName="mobileNumber" />

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />

    <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="loading">{{ loading ? 'Creating…' : 'Create account' }}</button>

    <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
