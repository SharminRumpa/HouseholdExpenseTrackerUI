<div class="auth-screen">
  <form class="panel auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand-mark">৳</div>
    <h1>Sign in</h1>
    <p>Household Expense Tracker</p>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    <span class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
      Enter a valid email address.
    </span>

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

    <button type="submit" class="btn-primary" [disabled]="isLoggingIn()">
      {{ isLoggingIn() ? 'Signing in...' : 'Sign In' }}
    </button>

    <!-- <p class="switch-link">No account? <a routerLink="/register">Register</a></p> -->
  </form>
</div>
