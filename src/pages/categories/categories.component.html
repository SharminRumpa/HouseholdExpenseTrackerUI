<div class="page-section" id="page-main-content">

  <div class="modal-header">
    <h2 class="table-title">Expense Categories List</h2>
  </div>

  <div *ngIf="isLoading()" class="state-message">Loading...</div>

  <div *ngIf="errorMessage()" class="state-message error">
    {{ errorMessage() }}
    <button type="button" class="retry-btn" (click)="loadData()">Retry</button>
  </div>

  <p class="empty-state" *ngIf="loading">Loading…</p>

  <ng-container *ngIf="!isLoading() && !errorMessage()">

    <div class="table-wrapper" *ngIf="expenseCategories().length; else noUsers">
      <table class="data-table">
        <thead>
          <tr>
            <th class="num">#</th>
            <th>Category name</th>
            <th>Description</th>
            <th>Is active</th>
            <!-- <th>Action</th> -->
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of pagedCategories(); let i = index">
            <td class="num">{{ i + 1 }}</td>
            <td>{{ category.categoryName }}</td>
            <td>{{ category.description }}</td>
            <td>{{ category.isActive ? 'Yes' : 'No' }}</td>
            <!--<td class="row-actions">
               <button class="icon-btn btn-edit" title="Edit" (click)="startEdit(category)">
                ✎ <span class="visually-hidden">Edit</span>
              </button>
              <button class="icon-btn btn-delete" title="Delete" (click)="remove(category)">
                🗑 <span class="visually-hidden">Delete</span>
              </button> 
            </td> -->
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #noUsers>
      <p class="empty-message">No users found.</p>
    </ng-template>

    <div class="pagination" *ngIf="expenseCategories().length">
      <button type="button" class="btn btn-pagination" (click)="previousPage()" [disabled]="currentPage() === 1">Previous</button>
      <span class="page-info">Page {{ currentPage() }} of {{ totalPages() }}</span>
      <button type="button" class="btn btn-pagination" (click)="nextPage()" [disabled]="currentPage() === totalPages()">Next</button>
    </div>

  </ng-container>

</div>
