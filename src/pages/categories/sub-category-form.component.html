<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Update Sub-Category' : 'Add New Sub-Category' }}</h2>
      <button
        type="button"
        class="modal-close"
        aria-label="Close"
        (click)="cancel()"
        [disabled]="isSaving()"
      >
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="expenseCategoryId">Category <span class="required">*</span></label>
        <select id="expenseCategoryId" formControlName="expenseCategoryId">
          <option [ngValue]="null" disabled>Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">
            {{ category.name }}
          </option>
        </select>
        <span
          class="field-error"
          *ngIf="form.controls.expenseCategoryId.touched && form.controls.expenseCategoryId.invalid"
        >
          Category is required.
        </span>
      </div>

      <div class="field">
        <label for="subCategoryName">Sub-Category Name <span class="required">*</span></label>
        <input
          id="subCategoryName"
          type="text"
          formControlName="subCategoryName"
          maxlength="100"
          placeholder="e.g. Vegetables"
        />
        <span
          class="field-error"
          *ngIf="form.controls.subCategoryName.touched && form.controls.subCategoryName.invalid"
        >
          Sub-category name is required.
        </span>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="2"
          maxlength="500"
        ></textarea>
      </div>

      <label class="checkbox-field" for="isActive">
        <input id="isActive" type="checkbox" formControlName="isActive" />
        <span>Active</span>
      </label>

      <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" (click)="cancel()" [disabled]="isSaving()">
          Cancel
        </button>
        <button type="submit" class="btn btn-save" [disabled]="isSaving()">
          {{ isSaving() ? 'Saving...' : isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
