<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>Add Income</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="field">
        <label for="incomeCategoryId">Category *</label>
        <select id="incomeCategoryId" formControlName="incomeCategoryId">
          <option [ngValue]="null" disabled>Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category.id">
            {{ category.name }}
          </option>
        </select>
        <span class="field-error"
          *ngIf="form.get('incomeCategoryId')?.touched && form.get('incomeCategoryId')?.invalid">
          Category is required.
        </span>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="incomeSourceId">Income Source</label>
          <select id="incomeSourceId" formControlName="incomeSourceId">
            <option [ngValue]="null">Select a source</option>
            <option *ngFor="let source of incomeSources" [ngValue]="source.id">
              {{ source.name }}
            </option>
          </select>
        </div>

        <div class="field">
          <label for="month">Month</label>
          <select id="month" formControlName="month">
            <option value="" disabled>Select a month</option>
            <option *ngFor="let m of months" [value]="m">{{ m }}</option>
          </select>
        </div>
      </div>



      <div class="field-row">
        <div class="field">
          <label for="receivedDate">Received Date *</label>
          <input id="receivedDate" type="date" formControlName="receivedDate" />
          <span class="field-error" *ngIf="form.get('receivedDate')?.touched && form.get('receivedDate')?.invalid">
            Received date is required.
          </span>
        </div>

        <div class="field">
          <label for="actualDate">Actual Date</label>
          <input id="actualDate" type="date" formControlName="actualDate" />
        </div>
      </div>

      <div class="field">
        <label for="amount">Amount *</label>
        <input id="amount" type="number" step="0.01" min="0" formControlName="amount" />
        <span class="field-error" *ngIf="form.get('amount')?.touched && form.get('amount')?.invalid">
          Enter an amount greater than 0.
        </span>
      </div>

      <div class="field">
        <label for="paymentMethod">Payment Method</label>
        <input id="paymentMethod" type="text" formControlName="paymentMethod" placeholder="e.g. Cash, Bank Transfer" />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="2"></textarea>
      </div>

      <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" (click)="cancel()" [disabled]="isSaving()">Cancel</button>
        <button type="submit" class="btn btn-save" [disabled]="isSaving()">
          {{ isSaving() ? 'Saving...' : 'Save' }}
        </button>
      </div>

    </form>

  </div>
</div>
