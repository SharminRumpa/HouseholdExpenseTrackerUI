<div class="modal-backdrop" (click)="cancel()">
  <div class="modal-panel" (click)="$event.stopPropagation()">

    
  <div class="modal-header">
      <h2>Add Expense</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="field-row">
        <div class="field">
          <label for="expenseCategoryId">Category <span class="required">*</span></label>
          <select id="expenseCategoryId" formControlName="expenseCategoryId">
            <option [ngValue]="null" disabled>Select a category</option>
            <option *ngFor="let category of categories" [ngValue]="category.id">
              {{ category.name }}
            </option>
          </select>
          <span class="field-error" *ngIf="form.controls.expenseCategoryId.touched && form.controls.expenseCategoryId.invalid">
            Category is required.
          </span>
        </div>

         <div class="field">
          <label for="expenseDate">Expense Date <span class="required">*</span></label>
          <input id="expenseDate" type="date" formControlName="expenseDate" />
          <span class="field-error" *ngIf="form.controls.expenseDate.touched && form.controls.expenseDate.invalid">
            Expense date is required.
          </span>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="expenseSubCategoryId">Sub Category <span class="required">*</span></label>
          <select id="expenseSubCategoryId" formControlName="expenseSubCategoryId">
            <option [ngValue]="null">Select a sub category</option>
            <option *ngFor="let sub of subCategories()" [ngValue]="sub.id">
              {{ sub.name }}
            </option>
          </select>
        </div>

        <div class="field">
          <label for="expenseItemId">Category Item <span class="required">*</span></label>
          <select id="expenseItemId" formControlName="expenseItemId">
            <option [ngValue]="null">Select an item</option>
            <option *ngFor="let item of expenseItems()" [ngValue]="item.id">
              {{ item.name }}
            </option>
          </select>
        </div>
      </div>

      <div class="field-row">
         <div class="field">
          <label for="paymentMethod">Payment Method</label>
          <input id="paymentMethod" type="text" formControlName="paymentMethod" placeholder="e.g. Cash, bKash" />
        </div>


        <div class="field">
          <label for="amount">Amount <span class="required">*</span></label>
          <input id="amount" type="number" step="0.01" min="0" formControlName="amount" />
          <span class="field-error" *ngIf="form.controls.amount.touched && form.controls.amount.invalid">
            Enter an amount greater than 0.
          </span>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="quantity">Quantity </label>
          <input id="quantity" type="number" step="0.001" min="0" formControlName="quantity" />
        </div>

        <div class="field">
          <label for="unit">Unit</label>
          <input id="unit" type="text" formControlName="unit" placeholder="e.g. pcs, dozen" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="netWeight">Net Weight</label>
          <input id="netWeight" type="number" step="0.001" min="0" formControlName="netWeight" />
        </div>

        <div class="field">
          <label for="weightUnit">Weight Unit</label>
          <input id="weightUnit" type="text" formControlName="weightUnit" placeholder="e.g. kg, g, L" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="expenseBy">Expense By</label>
          <input id="expenseBy" type="text" formControlName="expenseBy" />
        </div>

        <div class="field">
          <label for="expenseFor">Expense For</label>
          <input id="expenseFor" type="text" formControlName="expenseFor" />
        </div>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="2"></textarea>
      </div>

      <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <div class="form-actions">
        <button type="button" class="btn btn-cancel" (click)="cancel()" [disabled]="isSaving()">Cancel</button>
        <button type="submit" class="btn btn-save" [disabled]="isSaving()">
          {{ isSaving() ? 'Saving...' : 'Save' }}
        </button>
      </div>

    </form>

  </div>
</div>
